<!--
  Sentinel lab - Wazuh Agent configuration.
  Monitors the SSH target host: syslog/auth logs (SSH brute force) and
  file integrity of critical system paths.
-->
<ossec_config>

  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
  </client_buffer>

  <!-- SSH authentication logs - source of the brute-force detections -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- File integrity monitoring on system paths -->
  <syscheck>
    <frequency>43200</frequency>
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin</directories>
    <auto_ignore>yes</auto_ignore>
    <alert_new_files>yes</alert_new_files>
  </syscheck>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <sca>
    <disabled>yes</disabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

</ossec_config>
