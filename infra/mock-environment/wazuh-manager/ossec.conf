<!--
  Sentinel lab - Wazuh Manager configuration (mounted via /wazuh-config-mount).
  Minimal standalone manager: receives agent events, correlates them, and
  forwards alerts to the Sentinel Ingestion service using the custom-remote
  integration.
-->
<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <!-- Agent communication -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>udp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <sca>
    <disabled>yes</disabled>
  </sca>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin</directories>
    <auto_ignore>yes</auto_ignore>
    <alert_new_files>yes</alert_new_files>
  </syscheck>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <rules>
    <include>ruleset.xml</include>
    <include>local_rules.xml</include>
  </rules>

  <!-- Agent auto-registration (no password, lab only) -->
  <authd>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force_insert>yes</force_insert>
    <force_time>0</force_time>
    <purge>yes</purge>
    <use_password>no</use_password>
    <limit_maxagents>yes</limit_maxagents>
  </authd>

  <cluster>
    <disabled>yes</disabled>
  </cluster>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <!--
    Forward every alert with level >= 6 to the Sentinel Ingestion service.
    The custom-remote integration POSTs the full alert JSON to hook_url.
  -->
  <integration>
    <name>custom-remote</name>
    <hook_url>http://host.docker.internal:8080/webhooks/wazuh</hook_url>
    <level>6</level>
  </integration>

</ossec_config>
